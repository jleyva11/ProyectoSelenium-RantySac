name: UI Tests (Selenium + TestNG + Allure)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check Chrome
        run: |
          google-chrome --version || true
          which google-chrome || true

      # ✅ Escenario A: Levantar OWASP Juice Shop en localhost:3000
      - name: Start OWASP Juice Shop (Docker)
        run: |
          docker pull bkimminich/juice-shop
          docker run -d --name juice-shop -p 3000:3000 bkimminich/juice-shop

      # ✅ Esperar hasta que el servicio responda (readiness)
      - name: Wait for Juice Shop readiness
        run: |
          for i in {1..40}; do
            if curl -sSf "http://localhost:3000/#/" > /dev/null; then
              echo "Juice Shop is up!"
              exit 0
            fi
            echo "Waiting for Juice Shop... ($i)"
            sleep 2
          done
          echo "Juice Shop did not start in time"
          docker logs juice-shop
          exit 1

      # ✅ Ejecutar tests apuntando a localhost:3000 (evita ERR_CONNECTION_REFUSED)
      - name: Run TestNG tests (Maven)
        env:
          HEADLESS: "true"
          BASE_URL: "http://localhost:3000/#/login"
        run: mvn -B -e clean test

      - name: Generate Allure HTML report
        if: always()
        run: mvn -B allure:report
        continue-on-error: true

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload ChromeDriver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromedriver-log
          path: target/chromedriver.log
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            **/target/allure-results/**
            **/allure-results/**
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            **/target/site/allure-report/**
            **/target/site/allure-maven-plugin/**
          if-no-files-found: warn

      - name: Stop Juice Shop container
        if: always()
        run: |
          docker logs juice-shop || true
          docker stop juice-shop || true
          docker rm juice-shop || true