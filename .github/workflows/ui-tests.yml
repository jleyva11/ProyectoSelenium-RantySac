name: UI Tests (Selenium + TestNG + Allure)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check Chrome
        run: |
          google-chrome --version || true
          which google-chrome || true

      - name: Run TestNG tests (Maven)
        env:
          HEADLESS: "true"
        run: mvn -B -e clean test

      - name: Generate Allure HTML report
        if: always()
        run: mvn -B allure:report
        continue-on-error: true

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload chromedriver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromedriver-log
          path: target/chromedriver.log
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            **/target/allure-results/**
            **/allure-results/**
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            **/target/site/allure-report/**
            **/target/site/allure-maven-plugin/**
          if-no-files-found: warn